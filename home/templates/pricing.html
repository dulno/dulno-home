{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark">
    {% include 'home-header.html' %}
    <div id="pricing-container">
      <div id="pricing-wrapper" class="d-none">
        <h1 id="pricing-headline">{% trans 'home.pricing.headline' %}</h1>
        {% include 'pricing-content.html' %}
      </div>
    </div>
    <div id="pricing-footer" class="d-none">
      {% include 'home-footer.html' %}
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    var hasPersonalPackage = Cookie.find("expiration-has-personal-package");
    var hasOwnOrganization = Cookie.find("expiration-has-own-organization");
    var isOrganizationMember = Cookie.find("expiration-is-organization-member");
    var userName = Cookie.find("expiration-user-name");
    var homeToken = Cookie.find("home-token");
    if (hasPersonalPackage != null && hasOwnOrganization != null &&
      isOrganizationMember != null && userName != null && homeToken != null
    ) {
      window.location.href = "/expiration/";
      return;
    }
    displayLoader();
    setupPricing(function () {
      removeLoader();
    });
  });

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("pricing-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("pricing-container")
      .removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("pricing-wrapper").classList.remove("d-none");
    document.getElementById("pricing-footer").classList.remove("d-none");
  }
</script>
