{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'home-header.html' %}
    <div id="question-container">
      <h1 id="question-headline">{% trans 'home.question.headline' %}</h1>
      <div class="form-outline mb-4">
        <label for="question-email" class="form-label">* {% trans 'home.question.create.email' %} ({% trans 'home.question.information.required' %})</label>
        <input type="text" id="question-email" class="form-control" placeholder="{% trans 'home.question.create.email' %}">
      </div>
      <div class="form-outline mb-4">
        <label for="question-title" class="form-label">* {% trans 'home.question.create.title' %} ({% trans 'home.question.information.required' %})</label>
        <input type="text" id="question-title" class="form-control" placeholder="{% trans 'home.question.create.title' %}">
      </div>
      <div class="form-outline mb-4">
        <label for="question-message" class="form-label">* {% trans 'home.question.create.message' %} ({% trans 'home.question.information.required' %})</label>
        <div id="question-message">
        </div>
      </div>
      <p id="question-create-note" class="text-secondary my-3">{% trans 'home.question.create.note' %}</p>
      <button type="button" id="question-create" class="btn btn-primary btn-block disabled">{% trans 'home.question.create' %}</button>
    </div>
    {% include 'home-footer.html' %}
  </body>
</html>

<script>
  let quill = new Quill('#question-message', {
    modules: {
      toolbar: [
        [{'size': ['huge', 'large', false, 'small']}],
        ['bold', 'italic', 'underline'],
        ['image'],
        [{'list': 'ordered'}, {'list': 'bullet'}],
        [{'align': []}],
        [{'color': []}],
      ]
    },
    theme: 'snow'
  });

  document.getElementById("question-email").oninput = function(event) {
    checkQuestionCreatable();
  }

  document.getElementById("question-title").oninput = function(event) {
    checkQuestionCreatable();
  }

  quill.on('text-change', function(delta, oldDelta, source) {
    checkQuestionCreatable();
  });

  function checkQuestionCreatable() {
    if (document.getElementById("question-email").value !== "" &&
      document.getElementById("question-title").value !== "" &&
      document.getElementsByClassName("ql-editor")[0].innerHTML !== "<p><br></p>"
    ) {
      document.getElementById("question-create").classList.remove("disabled");
    } else {
      document.getElementById("question-create").classList.add("disabled");
    }
  }

  document.getElementById("question-create").onclick = function(event) {
    let email = document.getElementById("question-email").value;
    let title = document.getElementById("question-title").value;
    let message =  document.getElementsByClassName("ql-editor")[0].innerHTML;
    let request = new HttpRequest("/question/create/", "POST",
      [], {email: email, title: title, question: message});
    request.send(function (status, responseText) {
      if (status !== 200) {
        Swal.fire("{% trans 'home.question.create.limit.title' %}", "{% trans 'home.question.create.limit.body' %}", "error");
        return;
      }
      let success = JSON.parse(responseText).success;
      if (!success) {
        Swal.fire("{% trans 'home.question.create.failed.title' %}", "{% trans 'home.question.create.failed.body' %}", "error");
        return;
      }
      Swal.fire("{% trans 'home.question.create.successful.title' %}", "{% trans 'home.question.create.successful.body' %}", "success").then(success => window.location.href = "/");
    });
  }
</script>
