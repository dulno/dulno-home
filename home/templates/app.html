{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="light" data-bs-theme="light">
    {% include 'home-header.html' %}
    <div id="app-container">
      <h3 id="app-headline">{% trans 'app.headline' %}</h3>
      <h1 id="app-description">{% trans 'app.description' %}</h1>
      <div id="app-list">
        <div class="app-store">
          <button onclick="location.href='https://play.google.com/store/apps/details?id=com.dulno.app&pcampaignid=web_share'" class="app-button"><img src="{% static 'img/home/google-play-store.webp' %}"></img></button>
        </div>
        <div class="app-store">
          <button id="app-apple-button" onclick="location.href=''" class="app-button"><img src="{% static 'img/home/apple-store.webp' %}"></img></button>
        </div>
      </div>
    </div>
    {% include 'home-footer.html' %}
  </body>
</html>
