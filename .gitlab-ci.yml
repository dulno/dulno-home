stages:
  - build
  - scan
  - publish
  - deploy
  - merge

variables:
  DOCKER_IMAGE: "dulno-home"
  DOCKER_PROXY_IMAGE: "dulno-home-proxy"
  KUBERNETES_RESOURCE: "deployment/dulno-home-deployment"
  KUBERNETES_PROXY_RESOURCE: "deployment/dulno-home-proxy-deployment"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"

build_base_staging:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - echo "{\"auths\":{\"$STAGING_DOCKER_REGISTRY\":{\"username\":\"$STAGING_DOCKER_USERNAME\",\"password\":\"$STAGING_DOCKER_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg DOCKER_REGISTRY="$STAGING_DOCKER_REGISTRY" \
        --destination "$STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test"
  only:
    - dev

build_proxy_staging:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - echo "{\"auths\":{\"$STAGING_DOCKER_REGISTRY\":{\"username\":\"$STAGING_DOCKER_USERNAME\",\"password\":\"$STAGING_DOCKER_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/proxy/Dockerfile" \
        --build-arg DOCKER_REGISTRY="$STAGING_DOCKER_REGISTRY" \
        --build-arg SERVER_NAME="10.96.0.15" \
        --destination "$STAGING_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:test" \
  only:
    - dev

build_base_production:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - echo "{\"auths\":{\"$PRODUCTION_DOCKER_REGISTRY\":{\"username\":\"$PRODUCTION_DOCKER_USERNAME\",\"password\":\"$PRODUCTION_DOCKER_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg DOCKER_REGISTRY="$PRODUCTION_DOCKER_REGISTRY" \
        --destination "$PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test"
  only:
    - main

build_proxy_production:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - echo "{\"auths\":{\"$PRODUCTION_DOCKER_REGISTRY\":{\"username\":\"$PRODUCTION_DOCKER_USERNAME\",\"password\":\"$PRODUCTION_DOCKER_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/proxy/Dockerfile" \
        --build-arg DOCKER_REGISTRY="$PRODUCTION_DOCKER_REGISTRY" \
        --build-arg SERVER_NAME="dulno.com www.dulno.com" \
        --destination "$PRODUCTION_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:test" \
  only:
    - main

scan_staging:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $STAGING_DOCKER_USERNAME
    TRIVY_PASSWORD: $STAGING_DOCKER_PASSWORD
  script:
    - trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image "$STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test" --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/
    - trivy image "$STAGING_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:test" --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  only:
    - dev

scan_production:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $PRODUCTION_DOCKER_USERNAME
    TRIVY_PASSWORD: $PRODUCTION_DOCKER_PASSWORD
  script:
    - trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image "$PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test" --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/
    - trivy image "$PRODUCTION_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:test" --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  only:
    - main

publish_base_staging:
  stage: publish
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  before_script:
    - skopeo login --username "$STAGING_DOCKER_USERNAME" --password "$STAGING_DOCKER_PASSWORD" $STAGING_DOCKER_REGISTRY
  script:
    - |
      skopeo copy \
        docker://${STAGING_DOCKER_REGISTRY}/${DOCKER_IMAGE}:test \
        docker://${STAGING_DOCKER_REGISTRY}/${DOCKER_IMAGE}:latest
  only:
    - dev

publish_proxy_staging:
  stage: publish
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  before_script:
    - skopeo login --username "$STAGING_DOCKER_USERNAME" --password "$STAGING_DOCKER_PASSWORD" $STAGING_DOCKER_REGISTRY
  script:
    - |
      skopeo copy \
        docker://${STAGING_DOCKER_REGISTRY}/${DOCKER_PROXY_IMAGE}:test \
        docker://${STAGING_DOCKER_REGISTRY}/${DOCKER_PROXY_IMAGE}:latest
  only:
    - dev

publish_base_production:
  stage: publish
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  before_script:
    - skopeo login --username "$PRODUCTION_DOCKER_USERNAME" --password "$PRODUCTION_DOCKER_PASSWORD" $PRODUCTION_DOCKER_REGISTRY
  script:
    - |
      skopeo copy \
        docker://${PRODUCTION_DOCKER_REGISTRY}/${DOCKER_IMAGE}:test \
        docker://${PRODUCTION_DOCKER_REGISTRY}/${DOCKER_IMAGE}:latest
  only:
    - main

publish_proxy_production:
  stage: publish
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  before_script:
    - skopeo login --username "$PRODUCTION_DOCKER_USERNAME" --password "$PRODUCTION_DOCKER_PASSWORD" $PRODUCTION_DOCKER_REGISTRY
  script:
    - |
      skopeo copy \
        docker://${PRODUCTION_DOCKER_REGISTRY}/${DOCKER_PROXY_IMAGE}:test \
        docker://${PRODUCTION_DOCKER_REGISTRY}/${DOCKER_PROXY_IMAGE}:latest
  only:
    - main

deploy_base_staging:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$STAGING_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - dev

deploy_proxy_staging:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$STAGING_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_PROXY_RESOURCE
    - kubectl rollout status $KUBERNETES_PROXY_RESOURCE
  only:
    - dev

deploy_base_production:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$PRODUCTION_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - main

deploy_proxy_production:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$PRODUCTION_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_PROXY_RESOURCE
    - kubectl rollout status $KUBERNETES_PROXY_RESOURCE
  only:
    - main

merge:
  stage: merge
  image: curlimages/curl:latest
  script:
    - |
      curl --request POST --header "PRIVATE-TOKEN: $DULNO_GITLAB_PRIVATE_TOKEN" \
      --data "source_branch=dev&target_branch=main&title=Production deployment" \
      --data "remove_source_branch=false&squash=true" \
      "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests"
  only:
    - dev
  when: on_success