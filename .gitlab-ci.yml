stages:
  - build
  - scan
  - publish
  - deploy
  - merge

variables:
  DOCKER_IMAGE: "dulno-home"
  DOCKER_PROXY_IMAGE: "dulno-home-proxy"
  KUBERNETES_RESOURCE: "deployment/dulno-home-deployment"
  KUBERNETES_PROXY_RESOURCE: "deployment/dulno-home-proxy-deployment"

build_staging:
  stage: build
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $STAGING_DOCKER_PASSWORD | docker login -u $STAGING_DOCKER_USERNAME --password-stdin $STAGING_DOCKER_REGISTRY
    - docker build --build-arg DOCKER_REGISTRY="$STAGING_DOCKER_REGISTRY" -t $DOCKER_IMAGE:test .
    - docker save $DOCKER_IMAGE:test -o $DOCKER_IMAGE.tar
    - docker buildx build --build-arg DOCKER_REGISTRY="$STAGING_DOCKER_REGISTRY" --build-arg SERVER_NAME="10.96.0.15" --output type=docker -t $DOCKER_PROXY_IMAGE:test -f proxy/Dockerfile .
    - docker save $DOCKER_PROXY_IMAGE:test -o $DOCKER_PROXY_IMAGE.tar
  artifacts:
    paths:
      - $DOCKER_IMAGE.tar
      - $DOCKER_PROXY_IMAGE.tar
    expire_in: 1 hour
  only:
    - dev

build_production:
  stage: build
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $PRODUCTION_DOCKER_PASSWORD | docker login -u $PRODUCTION_DOCKER_USERNAME --password-stdin $PRODUCTION_DOCKER_REGISTRY
    - docker build --build-arg DOCKER_REGISTRY="$PRODUCTION_DOCKER_REGISTRY" -t $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test .
    - docker push $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test
    - docker buildx build --build-arg DOCKER_REGISTRY="$PRODUCTION_DOCKER_REGISTRY" --build-arg SERVER_NAME="dulno.com www.dulno.com" -t $PRODUCTION_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:test -f proxy/Dockerfile .
    - docker push $PRODUCTION_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:test
  only:
    - main

scan_staging:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - build_staging
  variables:
    GIT_STRATEGY: none
  script:
    - trivy --version
    - time trivy clean --scan-cache
    - time trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - docker load -i $DOCKER_IMAGE.tar
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $DOCKER_IMAGE:test
    - docker load -i $DOCKER_PROXY_IMAGE.tar
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $DOCKER_PROXY_IMAGE:test
  cache:
    paths:
      - .trivycache/
  only:
    - dev

scan_production:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - build_production
  variables:
    GIT_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TRIVY_USERNAME: $PRODUCTION_DOCKER_USERNAME
    TRIVY_PASSWORD: $PRODUCTION_DOCKER_PASSWORD
  script:
    - trivy --version
    - time trivy clean --scan-cache
    - time trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $PRODUCTION_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:test
  cache:
    paths:
      - .trivycache/
  only:
    - main

publish_staging:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - build_staging
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $STAGING_DOCKER_PASSWORD | docker login -u $STAGING_DOCKER_USERNAME --password-stdin $STAGING_DOCKER_REGISTRY
    - docker load -i $DOCKER_IMAGE.tar
    - docker tag $DOCKER_IMAGE:test $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker push $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker load -i $DOCKER_PROXY_IMAGE.tar
    - docker tag $DOCKER_PROXY_IMAGE:test $STAGING_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:latest
    - docker push $STAGING_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:latest
  only:
    - dev

publish_production:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - scan_production
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $PRODUCTION_DOCKER_PASSWORD | docker login -u $PRODUCTION_DOCKER_USERNAME --password-stdin $PRODUCTION_DOCKER_REGISTRY
    - docker pull $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test
    - docker tag $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker push $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker pull $PRODUCTION_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:test
    - docker tag $PRODUCTION_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:test $PRODUCTION_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:latest
    - docker push $PRODUCTION_DOCKER_REGISTRY/$DOCKER_PROXY_IMAGE:latest
  only:
    - main

deploy_staging:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish_staging
  before_script:
    - mkdir -p ~/.kube
    - echo "$STAGING_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout restart $KUBERNETES_PROXY_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_PROXY_RESOURCE
  only:
    - dev

deploy_production:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish_production
  before_script:
    - mkdir -p ~/.kube
    - echo "$PRODUCTION_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout restart $KUBERNETES_PROXY_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_PROXY_RESOURCE
  only:
    - main

merge:
  stage: merge
  image: curlimages/curl:latest
  script:
    - |
      curl --request POST --header "PRIVATE-TOKEN: $DULNO_GITLAB_PRIVATE_TOKEN" \
      --data "source_branch=dev&target_branch=main&title=Production deployment" \
      --data "remove_source_branch=false&squash=true" \
      "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests"
  only:
    - dev
  when: on_success